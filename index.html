<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Circuit Cards AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="./js/sim-components.js"></script>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 1;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 0: Resistor -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane position="0 -0.35 0.01" width="0.92" height="0.62"
               color="#0b1220" opacity="0.7"></a-plane>
      <a-text value="V = I x R" position="0 -0.2 0.02" align="center"
              width="1.6" color="#f59e0b"></a-text>
      <a-text value="Opposes current" position="0 -0.36 0.02" align="center"
              width="1.1" color="#ffffff"></a-text>
    </a-entity>

    <!-- 1: Capacitor -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-plane position="0 -0.35 0.01" width="0.92" height="0.62"
               color="#0b1220" opacity="0.7"></a-plane>
      <a-text value="Q = C x V" position="0 -0.09 0.02" align="center"
              width="1.6" color="#60a5fa"></a-text>
      <a-text value="tau = R x C" position="0 -0.17 0.02" align="center"
              width="1.1" color="#ffffff"></a-text>
      <a-entity id="cap-sim" sim-capacitor position="0 -0.36 0.02"></a-entity>
      <a-text id="cap-status" value="" position="0 -0.58 0.02" align="center"
              width="0.85" color="#ffffff"></a-text>
    </a-entity>

    <!-- 2: Inductor -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-plane position="0 -0.35 0.01" width="0.92" height="0.62"
               color="#0b1220" opacity="0.7"></a-plane>
      <a-text value="V = L x di/dt" position="0 -0.2 0.02" align="center"
              width="1.6" color="#22c55e"></a-text>
      <a-text value="tau = L / R" position="0 -0.36 0.02" align="center"
              width="1.1" color="#ffffff"></a-text>
    </a-entity>

    <!-- 3: Diode -->
    <a-entity mindar-image-target="targetIndex: 3">
      <a-plane position="0 -0.35 0.01" width="0.92" height="0.62"
               color="#0b1220" opacity="0.7"></a-plane>
      <a-text value="One-way current" position="0 -0.2 0.02" align="center"
              width="1.6" color="#a855f7"></a-text>
      <a-text value="Current flows one way" position="0 -0.36 0.02" align="center"
              width="1.1" color="#ffffff"></a-text>
    </a-entity>
  </a-scene>

  <script src="./js/app.js"></script>
</body>
</html>
